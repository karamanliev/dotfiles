# Use terminal syntax colors with muted line and changed-word tints.
[delta]
  # Main-section defaults override retained desktop delta.conf settings.
  # The shell supplies higher-priority mode-specific runtime overrides.
  features =
  light = false
  dark = true
  minus-style = "syntax #393333"
  plus-style = "syntax #333933"
  minus-emph-style = "syntax bold #634141"
  plus-emph-style = "syntax bold #416341"
  syntax-theme = ansi
  # Most unrecognized filenames here are extensionless shell dotfiles/scripts.
  default-language = sh
  minus-empty-line-marker-style = "red normal"
  plus-empty-line-marker-style = "green normal"
  zero-style = "syntax normal"
  line-numbers-minus-style = "red normal"
  line-numbers-plus-style = "green normal"
  line-numbers-zero-style = "normal normal"
  line-numbers-left-style = "normal normal"
  line-numbers-right-style = "normal normal"
  hunk-header-style = "file line-number syntax"
  hunk-header-decoration-style = "blue box"
  file-style = "blue bold"
  file-decoration-style = "blue box"
  commit-style = "yellow bold"
  commit-decoration-style = "yellow box"

[delta "terminal-pager"]
  paging = never
  hyperlinks = true
  hyperlinks-file-link-format = "lazygit-edit://{path}:{line}"
