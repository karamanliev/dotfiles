palette = "noctalia"
# Don't print a new line at the start of the prompt
add_newline = true

format = """
[╭─](white)$env_var$os in $directory$nodejs$git_branch$git_status$cmd_duration
[╰─](white)$character """
right_format = """$time"""

# Wait 10 milliseconds for starship to check files under the current directory.
scan_timeout = 100

[env_var]
variable = 'SHELL'
format = "$symbol"
disabled = false

[os]
format = '[$symbol](bold white)'
disabled = false

[os.symbols]
Arch = '[󰣇 ](#1793d1)'
Macos = '[󰀵 ](white)'
Ubuntu = '[ ](#e75320)'

[aws]
style = "bold yellow"

[character]
format = "$symbol"
success_symbol = "[❯](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold purple)"

[cmd_duration]
style = "bold yellow"

[directory]
style = "bold purple"
read_only = ' 🔒'
truncation_length = 8
truncation_symbol = "…/"
format = "[$read_only]($read_only_style)[$path]($style) "

# git settings
[git_branch]
style = "bold cyan"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold white"
ahead = '[\[⇡${count}\]](green)'
diverged = '[\[⇕⇡${ahead_count}⇣${behind_count}\]](yellow)'
untracked = '[\[?\]](white)'
behind = '[\[⇣${count}\]](red)'
renamed = "[»](yellow) "
stashed = '[\[⚑${count}\]](blue) '
deleted = "[✘](red) "
modified = "[✹](white) "
staged = '[\[+$count\]](green)'
conflicted = "═"

[hostname]
style = "bold #bd93f9"

[username]
format = "[$user]($style) on "
style_user = "bold #8be9fd"

[sudo]
disabled = true

[time]
disabled = false

[gcloud]
disabled = true

# Battery information
[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold orange"

[[battery.display]]
threshold = 60
style = "bold yellow"

[[battery.display]]
threshold = 100
style = "bold green"

