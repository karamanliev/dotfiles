# Theme
#source-file $XDG_CONFIG_HOME/tmux/themes/current_theme.conf

## Status
set -g status-justify left
set -g status-style "#{?client_prefix,fg=#{@noctalia_on_primary_container},fg=#{@noctalia_primary}} bg=#{@noctalia_surface}"
set -g status-left ""

## Modules right
set -g status-right "#(sh ~/.config/tmux/scripts/netbird-status.sh)#(sh ~/.config/tmux/scripts/clam-status.sh)#(sh ~/.config/tmux/scripts/battery-status.sh)#[default] #[fg=#{@noctalia_on_surface}]#H  #[default] #[fg=#{@noctalia_on_surface}]#S "
set -g status-right-length 100

## Windows left
set -g status-left-length 0
setw -g window-status-current-style "fg=#{@noctalia_surface} #{?client_prefix,bg=#{@noctalia_on_primary_container},bg=#{@noctalia_primary}}"
setw -g window-status-current-format " #I #W#{?window_zoomed_flag, <  ,} "
setw -g window-status-format " #[#{?client_prefix,fg=#{@noctalia_on_primary_container},fg=#{@noctalia_primary}}]#I #[fg=#{@noctalia_on_surface}]#W #F"
setw -g window-status-bell-style "fg=#{@noctalia_on_error_container} bg=#{@noctalia_surface} bold"

## Pane borders
set -g pane-border-style "fg=#{@noctalia_outline_variant}"
set -g pane-active-border-style "fg=#{@noctalia_on_primary_container}"

## Misc
### clock mode
setw -Fg clock-mode-colour "#{@noctalia_on_primary_container}"
### pane number display
set-option -Fg display-panes-active-colour "#{@noctalia_on_primary_container}"
set-option -Fg display-panes-colour "#{@noctalia_outline_variant}"
### leader + r
setw -g mode-style "fg=#{@noctalia_surface} bg=#{@noctalia_on_primary_container}"
### messages
set -g message-style "fg=#{@noctalia_primary} bg=#{@noctalia_surface_container}"
