git:
  diffRenderers:
    - command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
    - command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}" --side-by-side
gui:
  # sidePanelWidth: 0.25
  theme:
    activeBorderColor:
      - "#8da101"
      - bold
    inactiveBorderColor:
      - "#3a94c5"
    searchingActiveBorderColor:
      - "#f57d26"
      - bold
    optionsTextColor:
      - "#5c6a72"
    selectedLineBgColor:
      - "#ede8cc"
    inactiveViewSelectedLineBgColor:
      - bold
    cherryPickedCommitFgColor:
      - "#5c6a72"
    cherryPickedCommitBgColor:
      - "#f57d26"
    markedBaseCommitFgColor:
      - "#f57d26"
    markedBaseCommitBgColor:
      - "#f85552"
    unstagedChangesColor:
      - "#f85552"
    defaultFgColor:
      - "#5c6a72"
  shrinkSidePanelsToContent: true
  nerdFontsVersion: "3"
  expandFocusedSidePanel: true
  expandedSidePanelWeight: 3
  border: "single"
  showNumstatInFilesView: true
promptToReturnFromSubprocess: false
notARepository: "skip"
